name: Link check

# Every tool page lists external "Useful Resources"; this catches links that
# have died since. Runs weekly and on demand, never on pull requests.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 20
            --max-retries 2
            --accept 200..=299,403,429
            --exclude-path node_modules
            --exclude-path dist
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            --exclude 'example\.(com|org|net)'
            --exclude '^mailto:'
            './**/*.php' './**/*.md' './**/*.txt' './config/i18n/*.json'
          fail: true
